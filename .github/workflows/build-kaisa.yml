name: Build Chromeintosh Kaisa ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/firefox
          sudo rm -rf /opt/google /opt/microsoft /opt/pipx /usr/local/share
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential curl flex git gnat imagemagick \
            libncurses5-dev m4 nasm python-is-python3 uuid-dev zlib1g-dev \
            libssl-dev pkg-config libcmocka-dev libnss3-dev cpio wget
          gcc --version
          gnat --version
          nasm --version

      - name: Download MrChromebox firmware and extract UEFI payload
        run: |
          wget -q -O cbfstool.tar.gz https://mrchromebox.tech/files/util/cbfstool.tar.gz
          tar -zxf cbfstool.tar.gz
          chmod +x cbfstool

          wget -q -O mrchromebox.rom "https://mrchromebox.tech/files/firmware/full_rom/MrChromebox-2606.1/coreboot_edk2-kaisa-mrchromebox_20260714.rom"
          ls -lh mrchromebox.rom

          echo "=== CBFS payload ==="
          ./cbfstool mrchromebox.rom print | grep -i "payload"

          ./cbfstool mrchromebox.rom extract -n fallback/payload -f payload.elf -m x86
          ls -lh payload.elf

      - name: Clone Chromeintosh coreboot (without submodules)
        run: |
          git clone --depth=1 https://github.com/Chromeintosh/coreboot.git
          cd coreboot
          echo "=== Repo size ==="
          du -sh .

      - name: Configure coreboot with pre-built payload
        run: |
          cd coreboot
          cp configs/cml/config.kaisa.uefi .config
          echo "CONFIG_ANY_TOOLCHAIN=y" >> .config
          make olddefconfig

          ./scripts/config --disable PAYLOAD_EDK2
          ./scripts/config --disable PAYLOAD_TIANOCORE
          ./scripts/config --enable PAYLOAD_ELF
          ./scripts/config --set-str PAYLOAD_FILE "../payload.elf"
          make olddefconfig

          echo "=== Payload config ==="
          grep "PAYLOAD" .config | head -20
          echo "=== HECI related config ==="
          grep -i "heci" .config || echo "(none found)"

      - name: Disable HECI1 at end of boot
        run: |
          cd coreboot
          sed -i 's/^CONFIG_DISABLE_HECI1_AT_END_OF_BOOT=y/# CONFIG_DISABLE_HECI1_AT_END_OF_BOOT is not set/' .config
          sed -i 's/^CONFIG_DISABLE_HECI1_ON_BOOT=y/# CONFIG_DISABLE_HECI1_ON_BOOT is not set/' .config
          sed -i 's/^CONFIG_DISABLE_HECI1=y/# CONFIG_DISABLE_HECI1 is not set/' .config
          ./scripts/config --disable DISABLE_HECI1_AT_END_OF_BOOT 2>/dev/null || true
          ./scripts/config --disable DISABLE_HECI1_ON_BOOT 2>/dev/null || true
          ./scripts/config --disable DISABLE_HECI1 2>/dev/null || true
          make olddefconfig
          echo "=== HECI options after disable ==="
          grep -i "heci" .config || echo "(none found)"

      - name: Build coreboot
        run: |
          cd coreboot
          make -j$(nproc)
          echo "=== Build output ==="
          ls -lh build/coreboot.rom

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromeintosh-kaisa-rom
          path: coreboot/build/coreboot.rom
          retention-days: 30
