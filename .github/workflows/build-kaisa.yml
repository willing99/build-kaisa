name: Build Chromeintosh Kaisa ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/lib/firefox
          sudo rm -rf /opt/google /opt/microsoft /opt/pipx /usr/local/share
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison build-essential curl flex git gnat imagemagick \
            libncurses5-dev m4 nasm python-is-python3 uuid-dev zlib1g-dev \
            libssl-dev pkg-config libcmocka-dev libnss3-dev cpio wget \
            acpica-tools
          gcc --version
          gnat --version
          nasm --version

      - name: Clone Chromeintosh coreboot
        run: |
          git clone https://github.com/Chromeintosh/coreboot.git
          cd coreboot
          git submodule update --init --recursive --force
          echo "=== Repo size ==="
          du -sh .

      - name: Copy Kaisa config, enable any toolchain, expand defaults
        run: |
          cd coreboot
          cp configs/cml/config.kaisa.uefi .config
          echo "CONFIG_ANY_TOOLCHAIN=y" >> .config
          make olddefconfig
          echo "=== HECI related config options ==="
          grep -i "heci" .config || echo "(none found)"
          echo "=== EDK2 config ==="
          grep "EDK2_REPOSITORY\|EDK2_TAG\|EDK2_PLATFORMS" .config || echo "(none found)"

      - name: Disable HECI1 at end of boot
        run: |
          cd coreboot
          sed -i 's/^CONFIG_DISABLE_HECI1_AT_END_OF_BOOT=y/# CONFIG_DISABLE_HECI1_AT_END_OF_BOOT is not set/' .config
          sed -i 's/^CONFIG_DISABLE_HECI1_ON_BOOT=y/# CONFIG_DISABLE_HECI1_ON_BOOT is not set/' .config
          sed -i 's/^CONFIG_DISABLE_HECI1=y/# CONFIG_DISABLE_HECI1 is not set/' .config
          ./scripts/config --disable DISABLE_HECI1_AT_END_OF_BOOT 2>/dev/null || true
          ./scripts/config --disable DISABLE_HECI1_ON_BOOT 2>/dev/null || true
          ./scripts/config --disable DISABLE_HECI1 2>/dev/null || true
          make olddefconfig
          echo "=== HECI options after disable ==="
          grep -i "heci" .config || echo "(none found)"

      - name: Pre-create EDK2 workspace (fix OpenSSL submodule)
        run: |
          cd coreboot
          # Extract EDK2 repo URL and tag from config
          EDK2_REPO=$(grep "CONFIG_EDK2_REPOSITORY=" .config | head -1 | sed 's/.*="//;s/".*//')
          EDK2_TAG=$(grep "CONFIG_EDK2_TAG_OR_REV=" .config | head -1 | sed 's/.*="//;s/".*//')
          EDK2_PLAT_REPO=$(grep "CONFIG_EDK2_PLATFORMS_REPOSITORY=" .config | head -1 | sed 's/.*="//;s/".*//')
          EDK2_PLAT_TAG=$(grep "CONFIG_EDK2_PLATFORMS_TAG_OR_REV=" .config | head -1 | sed 's/.*="//;s/".*//')
          echo "EDK2 repo: $EDK2_REPO"
          echo "EDK2 tag: $EDK2_TAG"
          echo "EDK2 platforms repo: $EDK2_PLAT_REPO"
          echo "EDK2 platforms tag: $EDK2_PLAT_TAG"

          # Derive workspace directory name (3rd path component from URL)
          EDK2_NAME=$(echo "$EDK2_REPO" | sed 's|^\(https\?://\|git://\|ssh://\|git@\)[^/]*/||; s|\.git$||; s|.*/||')
          echo "EDK2 workspace name: $EDK2_NAME"
          WS="payloads/external/edk2/workspace"
          mkdir -p "$WS"

          # Pre-clone EDK2 with full history (no shallow)
          cd "$WS"
          git clone "$EDK2_REPO" "$EDK2_NAME"
          cd "$EDK2_NAME"
          git fetch origin
          git checkout "$EDK2_TAG" -f || echo "WARNING: checkout $EDK2_TAG failed"
          git submodule update --init --recursive --force
          echo "=== OpenSSL checkout verify ==="
          if [ -d "CryptoPkg/Library/OpensslLib/openssl" ]; then
            cd CryptoPkg/Library/OpensslLib/openssl
            git log --oneline -1
            cd -
          else
            echo "OpenSSL directory not found!"
          fi
          echo "=== Disk space ==="
          df -h /
          echo "=== Workspace size ==="
          du -sh .

      - name: Build coreboot
        run: |
          cd coreboot
          make -j$(nproc)
          echo "=== Build output ==="
          ls -lh build/coreboot.rom

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromeintosh-kaisa-rom
          path: coreboot/build/coreboot.rom
          retention-days: 30
